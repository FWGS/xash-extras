// Gamepad layout for the original Steam Controller (2015).
// Follows steam_controller_2026.cfg where the hardware allows. Main changes:
// * it has no right stick, the right trackpad aims instead
// * only two back grips, both used for movement, as the right thumb rests on the trackpad
// * left trackpad clicks act as dpad
joy_unbindall

// face buttons
bind "A_BUTTON" "+jump"
bind "B_BUTTON" "+duck"
bind "X_BUTTON" "+use"
bind "Y_BUTTON" "+reload"

// bumpers
bind "L1_BUTTON" "invprev"
bind "R1_BUTTON" "invnext"

// triggers are analogue, so no L2/R2
bind "LTRIGGER" "+attack2"
bind "RTRIGGER" "+attack"

// back grips. SDL orders them right hand first, so PADDLE1 is the right grip and PADDLE2 is the left one
bind "PADDLE1" "+duck"
bind "PADDLE2" "+jump"

// left trackpad clicks
bind "DPAD_UP" "invprev"
bind "DPAD_DOWN" "invnext"
bind "DPAD_LEFT" "savequick"
bind "DPAD_RIGHT" "lastinv"

// joystick and right trackpad clicks
bind "STICK1" "+voicerecord"
bind "STICK2" "impulse 100"

bind "BACK" "+showscores"
bind "START" "cancelselect"

// SDL reports the right trackpad as the right stick, so it aims through stick axes.
// Releases up to SDL 3.4 don't expose this controller's trackpads as touchpads. When they do,
// switch to joy_touchpad_right_mode look and joy_axis_binding "sf00rl", or it will aim twice
joy_axis_binding "sfpyrl"
joy_touchpad_right_mode off
joy_touchpad_left_mode off
