// Gamepad layout for DualShock 3, DualShock 4, DualSense and controllers with a similar layout.
// Follows xbox.cfg. Buttons are named after their Xbox positions:
// A is Cross, B is Circle, X is Square and Y is Triangle
joy_unbindall

// face buttons
bind "A_BUTTON" "+jump"
bind "B_BUTTON" "+duck"
bind "X_BUTTON" "+use"
bind "Y_BUTTON" "+reload"

// bumpers
bind "L1_BUTTON" "invprev"
bind "R1_BUTTON" "invnext"

// triggers
bind "LTRIGGER" "+attack2"
bind "RTRIGGER" "+attack"

// back paddles on DualSense Edge and some third party controllers. SDL orders them right hand first,
// so PADDLE1 is upper right, PADDLE2 is upper left, PADDLE3 is lower right and PADDLE4 is lower left
bind "PADDLE1" "savequick"
bind "PADDLE2" "+jump"
bind "PADDLE3" "loadquick"
bind "PADDLE4" "+duck"

// dpad
bind "DPAD_UP" "invprev"
bind "DPAD_DOWN" "invnext"
bind "DPAD_LEFT" "savequick"
bind "DPAD_RIGHT" "lastinv"

// joysticks clicks
bind "STICK1" "+voicerecord"
bind "STICK2" "impulse 100"

// BACK is Share or Create on PC and touchpad click on PS4 itself, as Share is reserved by the system there
bind "BACK" "+showscores"
bind "TOUCHPAD" "+showscores"
bind "START" "cancelselect"

joy_axis_binding "sfpyrl"
joy_touchpad_right_mode off
joy_touchpad_left_mode off
