// Gamepad layout for Steam Deck and Steam Controller (2026).
// Derived from Valve's official layout for Steam Deck, modified by a1ba
// Main changes:
// * left trackpad does nothing because we don't show menus on gamepad input
// * BACK shows scoreboard for multiplayer
// * right paddles are quick save and load
// * left stick click is push to talk
joy_unbindall

// face buttons
bind "A_BUTTON" "+jump"
bind "B_BUTTON" "+duck"
bind "X_BUTTON" "+use"
bind "Y_BUTTON" "+reload"

// bumpers
bind "L1_BUTTON" "invprev"
bind "R1_BUTTON" "invnext"

// triggers (on both Deck and Controller they are analogue, so no L2/R2)
bind "LTRIGGER" "+attack2"
bind "RTRIGGER" "+attack"

// back paddles. SDL orders them right hand first, so PADDLE1 is R4, PADDLE2 is L4, PADDLE3 is R5 and PADDLE4 is L5
bind "PADDLE1" "savequick"
bind "PADDLE2" "+jump"
bind "PADDLE3" "loadquick"
bind "PADDLE4" "+duck"

// dpad
bind "DPAD_UP" "invprev"
bind "DPAD_DOWN" "invnext"
bind "DPAD_LEFT" "savequick"
bind "DPAD_RIGHT" "lastinv"

// joysticks clicks
bind "STICK1" "+voicerecord"
bind "STICK2" "impulse 100"

bind "BACK" "+showscores"
bind "START" "cancelselect"

joy_axis_binding "sfpyrl"

// right trackpad aims. The left one is left off, Valve puts a save/load radial menu there and the engine has nothing equivalent yet
// SDL exposes these trackpads since 3.4, with older versions only the sticks work
joy_touchpad_right_mode look
joy_touchpad_left_mode off
