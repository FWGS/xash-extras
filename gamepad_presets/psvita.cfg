joy_unbindall

// face buttons
bind "A_BUTTON" "+use"
bind "B_BUTTON" "+jump"
bind "X_BUTTON" "+reload"
bind "Y_BUTTON" "+duck"

// L and R
bind "L1_BUTTON" "+attack2"
bind "R1_BUTTON" "+attack"

// dpad
bind "DPAD_UP" "lastinv"
bind "DPAD_DOWN" "impulse 100"
bind "DPAD_LEFT" "invprev"
bind "DPAD_RIGHT" "invnext"

bind "START" "escape"

joy_axis_binding "sfpyrl"
joy_touchpad_right_mode off
joy_touchpad_left_mode off
