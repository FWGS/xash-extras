// Gamepad layout for PS Vita and PS TV.
// Follows playstation.cfg where the hardware allows. Main changes:
// * L and R fire, as the handheld has no triggers
// * no stick clicks on the handheld, flashlight is on the touch screen, see touch_presets/psvita.cfg
// Buttons are named after their Xbox positions: A is Cross, B is Circle, X is Square and Y is Triangle
joy_unbindall

// face buttons
bind "A_BUTTON" "+jump"
bind "B_BUTTON" "+duck"
bind "X_BUTTON" "+use"
bind "Y_BUTTON" "+reload"

// L and R
bind "L1_BUTTON" "+attack2"
bind "R1_BUTTON" "+attack"

// dpad. weapon_crowbar only exists in Half-Life, rebind it for other mods
bind "DPAD_UP" "invprev"
bind "DPAD_DOWN" "invnext"
bind "DPAD_LEFT" "weapon_crowbar"
bind "DPAD_RIGHT" "lastinv"

bind "BACK" "+showscores"
bind "START" "cancelselect"

// DualShock 3 and 4 on PS TV also have triggers and stick clicks
bind "LTRIGGER" "+attack2"
bind "RTRIGGER" "+attack"
bind "STICK1" "+duck"
bind "STICK2" "impulse 100"

joy_axis_binding "sfpyrl"
joy_touchpad_right_mode off
joy_touchpad_left_mode off
