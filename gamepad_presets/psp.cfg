// Gamepad layout for PSP, follows Crow-bar's PSP port build 2603.
// The only analog stick is used to look around, so Triangle and Cross move instead.
// Buttons are named after their Xbox positions: A is Cross, B is Circle, X is Square and Y is Triangle
joy_unbindall

// face buttons
bind "A_BUTTON" "+back"
bind "B_BUTTON" "impulse 100"
bind "X_BUTTON" "+use"
bind "Y_BUTTON" "+forward"

// L and R
bind "L1_BUTTON" "+jump"
bind "R1_BUTTON" "+attack"

// dpad
bind "DPAD_UP" "+attack2"
bind "DPAD_DOWN" "+duck"
bind "DPAD_LEFT" "invprev"
bind "DPAD_RIGHT" "invnext"

// SELECT
bind "MODE" "toggleconsole"
bind "START" "escape"

joy_axis_binding "sfpyrl"
joy_touchpad_right_mode off
joy_touchpad_left_mode off
