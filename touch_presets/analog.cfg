// Circular analog sticks; select this preset in Touch options.
// Positions are normalized within the safe area; aspect 1 keeps icons round.
touch_removeall
touch_grid_enable 0
touch_look_speed 60
touch_look_curve 2
touch_aspectratio 0

touch_addbutton "move" "touch_sticks/stick_ring" "_joy" 0.060 0.600 0.240 0.920 255 255 255 200 2048 1
touch_addbutton "look" "touch_sticks/stick_ring" "_look" 0.700 0.600 0.880 0.920 255 255 255 200 2048 1
touch_addbutton "invprev" "touch_sticks/prev" "invprev" 0.020 0.240 0.090 0.364444 255 255 255 200 0 1
touch_addbutton "invnext" "touch_sticks/next" "invnext" 0.105 0.240 0.175 0.364444 255 255 255 200 0 1
touch_addbutton "reload" "touch_sticks/reload" "+reload" 0.560 0.340 0.640 0.482222 255 255 255 200 0 1
touch_addbutton "use" "touch_sticks/use" "+use" 0.680 0.340 0.760 0.482222 255 255 255 200 0 1
touch_addbutton "jump" "touch_sticks/jump" "+jump" 0.915 0.640 0.990 0.773333 255 255 255 200 0 1
touch_addbutton "attack" "touch_sticks/fire" "+attack" 0.890 0.360 0.995 0.546667 255 255 255 200 0 1
touch_addbutton "attack2" "touch_sticks/alt_fire" "+attack2" 0.795 0.340 0.875 0.482222 255 255 255 200 0 1
touch_addbutton "duck" "touch_sticks/crouch" "+duck" 0.915 0.860 0.990 0.993333 255 255 255 200 0 1
touch_addbutton "menu" "touch_sticks/menu" "cancelselect" 0.020 0.020 0.090 0.144444 255 255 255 200 0 1
touch_addbutton "edit" "touch_sticks/settings" "touch_enableedit" 0.105 0.020 0.175 0.144444 255 255 255 200 32 1
touch_addbutton "show_numbers" "touch_sticks/weapons" "exec touch_default/numbers.cfg" 0.400 0.020 0.470 0.144444 255 255 255 200 0 1
touch_addbutton "flashlight" "touch_sticks/flashlight" "impulse 100" 0.915 0.020 0.985 0.144444 255 255 255 200 0 1
touch_addbutton "loadquick" "touch_sticks/load" "loadquick" 0.745 0.020 0.815 0.144444 255 255 255 200 16 1
touch_addbutton "savequick" "touch_sticks/save" "savequick" 0.830 0.020 0.900 0.144444 255 255 255 200 16 1
touch_addbutton "scores" "touch_sticks/scores" "+showscores" 0.745 0.020 0.815 0.144444 255 255 255 200 8 1
touch_addbutton "messagemode" "touch_sticks/chat" "messagemode" 0.830 0.020 0.900 0.144444 255 255 255 200 8 1
touch_addbutton "spray" "touch_sticks/spray" "impulse 201" 0.660 0.020 0.730 0.144444 255 255 255 200 8 1
touch_addbutton "voicechat" "touch_sticks/mic" "+voicerecord" 0.565 0.020 0.635 0.144444 255 255 255 200 8 1
exec touch_sticks/crouch_hold.cfg
touch_roundall
