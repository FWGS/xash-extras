// Circular analog sticks; select this preset in Touch options.
// Positions are normalized within the safe area; aspect 1 keeps icons round.
touch_removeall
touch_grid_enable 0
touch_look_speed 60
touch_look_curve 2
touch_aspectratio 0

touch_addbutton "move" "gfx/touch/stick_ring" "_joy" 0.060 0.600 0.240 0.920 255 255 255 200 2048 1
touch_addbutton "look" "gfx/touch/stick_ring" "_look" 0.700 0.600 0.880 0.920 255 255 255 200 2048 1
touch_addbutton "invprev" "gfx/touch/prev" "invprev" 0.020 0.240 0.090 0.364444 255 255 255 200 0 1
touch_addbutton "invnext" "gfx/touch/next" "invnext" 0.105 0.240 0.175 0.364444 255 255 255 200 0 1
touch_addbutton "reload" "gfx/touch/reload" "+reload" 0.560 0.340 0.640 0.482222 255 255 255 200 0 1
touch_addbutton "use" "gfx/touch/use" "+use" 0.680 0.340 0.760 0.482222 255 255 255 200 0 1
touch_addbutton "jump" "gfx/touch/jump" "+jump" 0.915 0.640 0.990 0.773333 255 255 255 200 0 1
touch_addbutton "attack" "gfx/touch/fire" "+attack" 0.890 0.360 0.995 0.546667 255 255 255 200 0 1
touch_addbutton "attack2" "gfx/touch/alt_fire" "+attack2" 0.795 0.340 0.875 0.482222 255 255 255 200 0 1
touch_addbutton "duck" "gfx/touch/crouch" "+duck" 0.915 0.860 0.990 0.993333 255 255 255 200 0 1
touch_addbutton "menu" "gfx/touch/menu" "cancelselect" 0.020 0.020 0.090 0.144444 255 255 255 200 0 1
touch_addbutton "edit" "gfx/touch/settings" "touch_enableedit" 0.105 0.020 0.175 0.144444 255 255 255 200 32 1
touch_addbutton "show_numbers" "gfx/touch/weapons" "exec touch_default/numbers.cfg" 0.400 0.020 0.470 0.144444 255 255 255 200 0 1
touch_addbutton "flashlight" "gfx/touch/flashlight" "impulse 100" 0.915 0.020 0.985 0.144444 255 255 255 200 0 1
touch_addbutton "loadquick" "gfx/touch/load" "loadquick" 0.745 0.020 0.815 0.144444 255 255 255 200 16 1
touch_addbutton "savequick" "gfx/touch/save" "savequick" 0.830 0.020 0.900 0.144444 255 255 255 200 16 1
touch_addbutton "scores" "gfx/touch/scores" "+showscores" 0.745 0.020 0.815 0.144444 255 255 255 200 8 1
touch_addbutton "messagemode" "gfx/touch/chat" "messagemode" 0.830 0.020 0.900 0.144444 255 255 255 200 8 1
touch_addbutton "spray" "gfx/touch/spray" "impulse 201" 0.660 0.020 0.730 0.144444 255 255 255 200 8 1
touch_addbutton "voicechat" "gfx/touch/mic" "+voicerecord" 0.565 0.020 0.635 0.144444 255 255 255 200 8 1
// Hold crouch by default for duck-jump and long-jump timing.
exec touch_sticks/crouch_hold.cfg
touch_roundall
